<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" fill="none">
  <defs>
    <linearGradient id="kGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="kNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#091526" />
    </linearGradient>
    <filter id="kCrestShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Emblem Shield Crest -->
  <g filter="url(#kCrestShadow)">
    <!-- Outer Shield Frame -->
    <path d="M 35 4 L 62 16 L 62 48 L 35 64 L 8 48 L 8 16 Z" 
          fill="url(#kNavyGrad)" 
          stroke="url(#kGoldGrad)" 
          stroke-width="3" 
          stroke-linejoin="round"/>
    
    <!-- Inner Accent Inset -->
    <path d="M 35 9 L 57 19 L 57 45 L 35 59 L 13 45 L 13 19 Z" 
          fill="none" 
          stroke="url(#kGoldGrad)" 
          stroke-width="1" 
          stroke-dasharray="3 2" 
          opacity="0.8"/>

    <!-- Stylized Modern 'K' Monogram -->
    <!-- Vertical Spine -->
    <path d="M 24 19 L 31 19 L 31 51 L 24 51 Z" fill="#ffffff"/>
    <!-- Diagonal Upper Arm -->
    <path d="M 31 33 L 44 19 L 52 19 L 36 36 Z" fill="url(#kGoldGrad)"/>
    <!-- Diagonal Lower Arm -->
    <path d="M 33 33 L 51 51 L 43 51 L 29 38 Z" fill="url(#kGoldGrad)"/>

    <!-- Apex Star Accent -->
    <polygon points="35,11 36.5,15 40.5,15 37.2,17.5 38.5,21.5 35,19 31.5,21.5 32.8,17.5 29.5,15 33.5,15" fill="url(#kGoldGrad)"/>
  </g>
</svg>